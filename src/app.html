<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="manifest" href="%sveltekit.assets%/site.webmanifest" />

    <!-- ✅ SEO Meta Tags -->
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="googlebot" content="index, follow" />
    <meta name="bingbot" content="index, follow" />
    <meta name="author" content="TicketsDMK" />
    <meta name="generator" content="SvelteKit" />
    <meta name="format-detection" content="telephone=yes" />
    <meta name="description" content="Compra tus entradas para eventos y eventos en España. TicketsDMK conecta con salas, artistas y vuelos al mejor precio.">
    <meta property="og:title" content="TicketsDMK – Entradas para eventos y eventos" />
    <meta property="og:description" content="Compra tus entradas para eventos y eventos con TicketsDMK. Rápido, seguro y conectado con tus ciudades favoritas." />
    <meta property="og:image" content="%sveltekit.assets%/logo-ticketsdmk.jpg?v=2" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ticketsdmk.com" />

    <!-- Canonical (default) -->
    <link rel="canonical" href="https://ticketsdmk.com/" />

    <!-- Structured data to help search engines understand the site -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "%sveltekit.base%#organization",
            "name": "TicketsDMK",
            "url": "%sveltekit.base%/",
            "logo": "%sveltekit.assets%/logo-ticketsdmk.jpg?v=2"
          },
          {
            "@type": "WebSite",
            "@id": "%sveltekit.base%#website",
            "url": "%sveltekit.base%/",
            "name": "TicketsDMK",
            "publisher": { "@id": "%sveltekit.base%#organization" }
          }
        ]
      }
    </script>

    <!-- ✅ Favicon Pack -->
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" />
    <link rel="icon" type="image/png" sizes="32x32" href="%sveltekit.assets%/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="%sveltekit.assets%/favicon-16x16.png" />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <meta name="theme-color" content="#3b82f6" />

    <!-- ✅ Title -->
    <title>TicketsDMK – Entradas y vuelos musicales</title>

    <!-- ✅ Fonts / Styles -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Fallback enforce base font-size to avoid host scaling differences -->
    <style>html{font-size:16px!important}</style>

    %sveltekit.head%
  </head>

  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
