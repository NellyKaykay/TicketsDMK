<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <!-- Google Fonts import for elegant typography -->
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&amp;display=swap');
      .logo-text {
        font-family: 'Playfair Display', serif;
        font-weight: 900;
        letter-spacing: 3px;
        text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
      }
    </style>
  </defs>
  
  <!-- Text: TicketsDMK in one line -->
  <text x="100" y="45" class="logo-text" font-size="28" fill="#003333" text-anchor="middle" dominant-baseline="middle" stroke="#003333" stroke-width="0.3">
    TicketsDMK
  </text>
</svg>